name: Evening refresh
on:
  schedule:
    - cron: '30 13 * * 1-5'   # 19:00 IST, after NSE close + filings settle
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run refresh
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Commit snapshot (Vercel redeploys on push)
        run: |
          git config user.name "finn-bot"
          git config user.email "finn-bot@users.noreply.github.com"
          git add data/snapshot
          git diff --cached --quiet || git commit -m "data: evening refresh $(date -u +%F)"
          git push
